name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dor
          POSTGRES_PASSWORD: dor
          POSTGRES_DB: dor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dor -d dor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOR_TEST_DATABASE_URL: postgres://dor:dor@127.0.0.1:5433/dor_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Exactly the local gate: go build/vet/test -race, proto drift, web
      # install/lint/typecheck/test/build.
      - run: make ci
