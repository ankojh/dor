# Model pins, endpoints and the price schedule used for budget estimates.
#
# The jev model is pinned on purpose. The floating alias ~typesafe/jev-latest
# is rejected by internal/decide: thresholds are model-specific and must be
# re-tuned per pinned version (docs/jev-api.md).
#
# Claude prices are config placeholders used to estimate spend before a call
# and to report cost per item. They are NOT authoritative; check the current
# price list before a paid run. jev reports usage.cost from the API, which is
# authoritative for jev. Claude cached input is priced at the documented 0.1x
# (read) and 1.25x (write) multiples of input unless
# cache_read_per_mtok / cache_write_per_mtok override them. The result is an
# estimate, not an invoice.
version: 1

jev:
  model: typesafe/jev-1.14
  # OpenRouter is used for DOR_JEV_API_KEY and OPENROUTER_API_KEY. A
  # TYPESAFE_API_KEY on its own goes to the typesafe block below.
  base_url: https://openrouter.ai
  path: /api/alpha/decisions
  timeout: 30s
  max_retries: 4
  min_backoff: 250ms
  max_backoff: 8s
  # Used only to estimate spend before the call. Live jev cost comes from
  # usage.cost in the response.
  price:
    input_per_mtok: 0.10
    output_per_mtok: 0.00
    provisional: true
  # TypeSafe direct (docs.typesafe.ai, checked 2026-11-21). Same request and
  # answer shape as OpenRouter, but no id and no usage.cost, so cost is
  # input_tokens x price. Output tokens are free. TYPESAFE_BASE_URL or a
  # non-OpenRouter DOR_JEV_BASE_URL overrides base_url; an OpenRouter value is
  # ignored here so a TypeSafe key never leaves TypeSafe's host.
  typesafe:
    model: jev-1.14.0
    base_url: https://api.typesafe.ai
    path: /v1/systemone
    price:
      input_per_mtok: 0.042
      output_per_mtok: 0.00

claude:
  haiku_model: claude-haiku-5-5
  opus_model: claude-opus-5-5
  # Both models get an explicit effort. Opus 5.5 cannot disable thinking, so
  # effort (not thinking.budget_tokens) controls cost.
  effort: low
  timeout: 120s
  max_retries: 4
  min_backoff: 500ms
  max_backoff: 15s
  price:
    claude-haiku-5-5:
      input_per_mtok: 1.00
      output_per_mtok: 5.00
      provisional: true
    claude-opus-5-5:
      input_per_mtok: 15.00
      output_per_mtok: 75.00
      provisional: true
