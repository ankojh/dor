// Dor wire protocol.
//
// Field numbers and enum values follow the plan (section 6 "Data model &
// schemas" and section 7 "Realtime protocol"). Do not renumber or reuse tags:
// browser tabs and agents may be running older builds.
//
// Enum zero values intentionally carry the plan's names (OTHER, COUNTRY,
// VENUE, ...) even though classic protobuf style suggests an _UNSPECIFIED
// suffix. The ENUM_ZERO_VALUE_SUFFIX buf lint rule is disabled for that reason.
syntax = "proto3";

package dor.v1;

option go_package = "github.com/ankojh/dor/internal/pb/dorv1;dorv1";

// Category is the topic of an article or story.
enum Category {
  CATEGORY_OTHER = 0;
  CATEGORY_CONFLICT = 1;
  CATEGORY_POLITICS = 2;
  CATEGORY_ECONOMY = 3;
  CATEGORY_TECH = 4;
  CATEGORY_CLIMATE = 5;
  CATEGORY_DISASTER = 6;
  CATEGORY_HEALTH = 7;
  CATEGORY_SCIENCE = 8;
  CATEGORY_SPORTS = 9;
  CATEGORY_CULTURE = 10;
}

// Precision says how exactly a location is known.
enum Precision {
  PRECISION_COUNTRY = 0;
  PRECISION_REGION = 1;
  PRECISION_CITY = 2;
  PRECISION_STREET = 3;
  PRECISION_POINT = 4;
}

// Role is what a place is to an article or story.
enum Role {
  ROLE_VENUE = 0;
  ROLE_ORIGIN = 1;
  ROLE_PARTY = 2;
  ROLE_AFFECTED = 3;
  ROLE_MENTIONED = 4;
}

// LinkType is the kind of relationship between two stories.
enum LinkType {
  LINK_TYPE_CAUSAL = 0;
  LINK_TYPE_REACTION = 1;
  LINK_TYPE_THEMATIC = 2;
}

// Direction says which story acted on the other.
enum Direction {
  DIRECTION_A_TO_B = 0;
  DIRECTION_B_TO_A = 1;
  DIRECTION_UNCLEAR = 2;
}

// JoinKind says how an article entered its story.
enum JoinKind {
  JOIN_KIND_NEW = 0;    // the article started a new story
  JOIN_KIND_JOINED = 1; // the article joined an existing story
}

// Location is one place attached to an article or story.
message Location {
  string place_id = 1;
  string name = 2;
  float lat = 3;
  float lon = 4;
  Precision precision = 5;
  Role role = 6;
  float weight = 7;
  // ISO 3166-1 alpha-2 country code when the resolved place knows one. Empty
  // means unknown; the publisher uses it as the canonical region-filter code.
  string country = 8;
}

// Article is the normalized ingest record. The full text is never stored.
message Article {
  string id = 1;
  string source_id = 2;
  string url = 3;
  string title = 4;
  string lede = 5;
  int64 published_at = 6; // unix seconds
  string lang = 7;
  string dateline = 8;
  // Append-only hints from the raw item. The plotter still decides the place;
  // these only save it work and feed hazard heat.
  RawHints hints = 9;
  bool burst = 10; // GDELT bulk item; the wire collapses bursts
  // Set only on article.placed; clean articles leave these at their zero
  // values. Append-only so the existing publisher can still decode Article.
  string story_id = 11;
  JoinKind join = 12;
  // Provenance carried on article.placed so the wire can label guesses. Zero
  // values mean unknown/not degraded.
  bool degraded = 13;
  bool fallback = 14;
  string category_backend = 15;   // jev, claude, rule, or empty
  float category_confidence = 16; // 0..1; 0 is unknown
  string place_backend = 17;      // jev, claude, gazetteer, hints, none
  bool place_degraded = 18;
  bool place_fallback = 19;
  // Canonical country of the resolved place (ISO 3166-1 alpha-2), not the
  // raw feed hint.
  string country = 20;
}

// PlacedArticle is the plotter's output on article.place. It carries the
// article snapshot so the clusterer can join without a second read.
message PlacedArticle {
  Article article = 1;
  repeated Location locations = 2;
  uint32 primary = 3; // index into locations, 0 when global
  bool multi_region = 4;
  bool fallback = 5;   // a fallback path was used
  bool degraded = 6;   // no model/service; deterministic result only
  string backend = 7;  // jev, claude, gazetteer, hints, none
}

// ClassifiedArticle is the classifier's output on article.class.
message ClassifiedArticle {
  Article article = 1;
  Category category = 2;
  float confidence = 3;
  bool accepted = 4;   // passed the configured threshold
  bool fallback = 5;
  bool degraded = 6;
  string backend = 7;
  string lang = 8;
  repeated string entities = 9;
}

// EmbeddedArticle is the embedder's output on article.vec.
message EmbeddedArticle {
  Article article = 1;
  repeated float vector = 2; // 384-d
  string model = 3;
  bool degraded = 4; // deterministic hash fallback, not TEI
  // Set on article.placed: the story the clusterer assigned and how it joined.
  string story_id = 11;
  JoinKind join = 12;
}

// Story is a cluster of articles about one event.
// The brief is fetched lazily, so it is not part of this message.
message Story {
  string id = 1;
  string title = 2;
  Category category = 3;
  repeated Location locations = 4;
  uint32 primary = 5; // index into locations
  uint32 source_count = 6;
  float heat = 7;
  int64 first_seen = 8;  // unix seconds
  int64 updated_at = 9;  // unix seconds
  // Append-only provenance for displayed values. Zero values mean unknown or
  // not degraded. The UI marks degraded metadata "approx".
  bool degraded = 10;
  bool fallback = 11;
  string category_backend = 12;   // jev, claude, rule, or empty
  float category_confidence = 13; // 0..1; 0 is unknown
  string place_backend = 14;      // jev, claude, gazetteer, hints, none
  bool place_degraded = 15;
  bool place_fallback = 16;
  // Hazard metadata from the article hints. Used to demote micro-quakes in
  // live-thread ranking; not part of story identity.
  string hazard = 17;   // earthquake, flood, cyclone, ...
  double magnitude = 18; // upstream magnitude, 0 when unknown
  // title_source is "editor" when the Editor's neutral title is applied, or
  // "source" when the title is a source headline.
  string title_source = 19;
}

// Link is a typed relationship between two stories, with a < b.
message Link {
  string a = 1;
  string b = 2;
  LinkType type = 3;
  Direction dir = 4;
  float confidence = 5;
  float strength = 6;
  int64 updated_at = 7; // unix seconds
  // Unverified is set on similarity-only thematic links emitted when the
  // relation judge has no model answer. The browser labels these.
  bool unverified = 8;
}

// LinkKey identifies a link without its mutable scores.
message LinkKey {
  string a = 1;
  string b = 2;
}

// AlertHit is a user alert firing for a story.
message AlertHit {
  string alert_id = 1;
  string story_id = 2;
  string level = 3;    // "new" or "escalated"
  int64 fired_at = 4;  // unix seconds
  string title = 5;    // story title at fire time
  string prompt = 6;   // the alert prompt
  uint64 generation = 7; // 0=new, then one per sources doubling
  bool approx = 8; // embedding/lexical match without jev
  uint32 source_count = 9;
}

// WireRow is one row in the live wire.
message WireRow {
  string article_id = 1;
  string story_id = 2;
  string title = 3;
  string source = 4;
  string place = 5;
  Category category = 6;
  int64 at = 7; // unix seconds
  JoinKind join = 8;
  map<string, float> prompt_scores = 9;
  // Append-only filter fields. Empty/zero means unknown.
  string country = 10; // ISO 3166-1 alpha-2 when the source supplies one
  string lang = 11;
  double lat = 12;
  double lon = 13;
  bool located = 14;
  // Prompts scored without a jev answer (embedding/lexical only).
  repeated string approx_prompts = 15;
  // Append-only metadata provenance, mirrored from the placed article and its
  // story when the story arrives. Zero values mean unknown/not degraded.
  bool degraded = 16;
  bool fallback = 17;
  string category_backend = 18;
  float category_confidence = 19;
  string place_backend = 20;
  bool place_degraded = 21;
  bool place_fallback = 22;
}

// Delta is one numbered change pushed to browsers.
message Delta {
  uint64 seq = 1;
  oneof body {
    Story story_upsert = 2;
    string story_expire = 3;
    Link link_upsert = 4;
    LinkKey link_remove = 5;
    WireRow wire = 6;
    AlertHit alert = 7;
  }
}

// Snapshot is the full live state a client starts from.
message Snapshot {
  uint64 seq = 1;
  repeated Story stories = 2;
  repeated Link links = 3;
  int64 built_at = 4; // unix seconds
  // Recent wire rows for a first connection or reload, newest last. These are
  // not deltas and carry no sequence: they let the wire show real articles
  // immediately without replaying old deltas as new ones.
  repeated WireRow recent_wire = 5;
}

// DeltaBatch carries deltas from a snapshot seq onwards.
message DeltaBatch {
  repeated Delta deltas = 1;
}

// Resync tells a client to discard local state and start from a snapshot.
message Resync {
  uint64 seq = 1;
  string reason = 2;
}

// ServerMessage is the envelope for everything the server sends.
message ServerMessage {
  oneof body {
    Snapshot snapshot = 1;
    DeltaBatch deltas = 2;
    Resync resync = 3;
  }
}

// Hello is the first client message.
message Hello {
  uint64 last_seq = 1;
  string client_version = 2;
}

// SetFilters replaces the client's wire filters.
message SetFilters {
  repeated Category categories = 1;
  repeated string regions = 2;
  uint32 min_sources = 3;
  repeated string lang = 4;
  // Append-only server-side wire filters. Empty/zero means no constraint.
  repeated string sources = 5;
  double lat = 6;
  double lon = 7;
  double radius_km = 8;
}

// SetPrompts replaces the client's prompts. The server backfills 1 h.
message SetPrompts {
  repeated string prompts = 1;
}

// Focus raises prefetch priority for one story.
message Focus {
  string story_id = 1;
}

// GetText asks for lazy text (story briefs and link "why").
message GetText {
  repeated string story_ids = 1;
  repeated LinkKey link_keys = 2;
}

// Ack acknowledges the last applied delta seq.
message Ack {
  uint64 seq = 1;
}

// ClientMessage is the envelope for everything the client sends.
message ClientMessage {
  oneof body {
    Hello hello = 1;
    SetFilters set_filters = 2;
    SetPrompts set_prompts = 3;
    Focus focus = 4;
    GetText get_text = 5;
    Ack ack = 6;
  }
}

// SourceKind is the fetch family of a raw article's source. It is how the
// normalizer and the wire tell a feed item from a GDELT bulk row or a hazard
// alert without consulting the source list.
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_RSS = 1;
  SOURCE_KIND_GDELT = 2;
  SOURCE_KIND_USGS = 3;
  SOURCE_KIND_GDACS = 4;
  SOURCE_KIND_EONET = 5;
  SOURCE_KIND_RELIEFWEB = 6;
}

// RawHints are the fetcher's untrusted location and severity signals. The
// plotter still decides the final place; hints only save it work and feed the
// heat boost for hazards.
message RawHints {
  bool located = 1;        // lat/lon are usable
  double lat = 2;
  double lon = 3;
  Precision precision = 4;
  repeated string themes = 5;
  string country = 6;      // ISO 3166-1 code when the upstream provides one; empty otherwise
  string hazard = 7;       // earthquake, flood, cyclone, volcano, ...
  double magnitude = 8;    // upstream magnitude, e.g. quake Mw
  double severity = 9;     // normalised 0..1 where the upstream gives a scale
  string event_id = 10;    // upstream id (USGS/GDACS/EONET/GDELT record)
  string magnitude_unit = 11; // "Mw", "m/s", "knots", "acres", ...
  string place = 12;       // upstream place name, e.g. "Delhi, India"
  string revision = 13;    // upstream revision (update time, episode+alert level, geometry date)
}

// RawArticle is one fetched item before normalization. The fetchers write it
// to article.raw; hazards write the same message to article.raw.priority.
// Only a short snippet is carried, never the full article text.
message RawArticle {
  string id = 1;          // raw:<sha256(url)>; the normalizer assigns the canonical id later
  string source_id = 2;   // id from deploy/sources/sources.yaml
  SourceKind kind = 3;
  string url = 4;
  string title = 5;
  string summary = 6;     // short snippet, never full text
  int64 published_at = 7; // unix seconds; 0 when the source does not say
  int64 fetched_at = 8;   // unix seconds
  string lang = 9;        // BCP 47 when known
  RawHints hints = 10;
  bool burst = 11;        // GDELT bulk: the wire collapses bursts by source/time/place
}

// MatchScore carries prompt-filter scores for one article. The matcher writes
// it to match.score; the publisher folds the scores into the wire row.
message MatchScore {
  string article_id = 1;
  map<string, float> scores = 2;
  repeated string approx = 3;
  int64 updated_at = 4;
}

// RecordFrame is one raw pipeline message inside a record-mode file. See
// docs/record-format.md. A file is an eight-byte magic header followed by
// length-delimited RecordFrame frames, gzip-compressed.
message RecordFrame {
  string subject = 1;       // article.raw or article.raw.priority
  string msg_id = 2;        // Nats-Msg-Id, so a replay is idempotent
  int64 received_at_ms = 3; // unix milliseconds when the writer accepted it
  bytes payload = 4;        // serialized RawArticle
}
